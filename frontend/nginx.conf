server {
    listen 80;
    server_name _;
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # A variable makes Nginx resolve the Service at request time instead of
    # exiting when cluster DNS is briefly unavailable during node startup.
    set $backend_origin http://backend.demo-app.svc.cluster.local:8000;

    # Proxy API requests to FastAPI.
    location /api/ {
        proxy_pass $backend_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy health requests to FastAPI.
    location /health/ {
        proxy_pass $backend_origin;
        proxy_set_header Host $host;
    }

    # Serve the React entry point for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
