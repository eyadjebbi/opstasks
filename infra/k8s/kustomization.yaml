apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-app
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
secretGenerator:
  # Local development defaults; replace these values outside Minikube.
  - name: opstasks-secret
    literals:
      - DATABASE_NAME=opstasks
      - DATABASE_USER=opstasks
      - DATABASE_PASSWORD=opstasks
generatorOptions:
  disableNameSuffixHash: true
