apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: opstasks-frontend:1.0.0
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://backend:8000/health/live; do
                sleep 2
              done
      containers:
        - name: frontend
          image: opstasks-frontend:1.0.0
          imagePullPolicy: Never
          env:
            - name: DNS_RESOLVER
              value: "10.96.0.10"
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo-app
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
