apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready \
                -h "${DATABASE_HOST}" \
                -p "${DATABASE_PORT}" \
                -U "${DATABASE_USER}" \
                -d "${DATABASE_NAME}"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: opstasks-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: opstasks-config
                  key: DATABASE_PORT
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: opstasks-secret
                  key: DATABASE_USER
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: opstasks-secret
                  key: DATABASE_NAME
      containers:
        - name: backend
          image: opstasks-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: opstasks-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: opstasks-config
                  key: DATABASE_PORT
            - name: ENABLE_DEMO_FAULTS
              valueFrom:
                configMapKeyRef:
                  name: opstasks-config
                  key: ENABLE_DEMO_FAULTS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: opstasks-config
                  key: LOG_LEVEL
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: opstasks-secret
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opstasks-secret
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: opstasks-secret
                  key: DATABASE_NAME
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo-app
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
