apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: opstasks-backend:1.0.0
          imagePullPolicy: Never
          command:
            - python
            - -c
            - |
              import socket
              import time

              while True:
                  try:
                      with socket.create_connection(("postgres", 5432), timeout=2):
                          break
                  except OSError:
                      time.sleep(2)
      containers:
        - name: backend
          image: opstasks-backend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_NAME
              value: opstasks
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: opstasks-secret
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opstasks-secret
                  key: DATABASE_PASSWORD
            - name: ENABLE_DEMO_FAULTS
              value: "true"
            - name: DEMO_SLOW_DELAY_SECONDS
              value: "3"
            - name: DATABASE_STARTUP_MAX_ATTEMPTS
              value: "30"
            - name: DATABASE_STARTUP_RETRY_SECONDS
              value: "2"
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo-app
spec:
  selector:
    app: backend
  ports:
    - port: 8000
