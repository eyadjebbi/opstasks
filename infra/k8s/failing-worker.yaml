apiVersion: apps/v1
kind: Deployment
metadata:
  name: failing-worker
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: failing-worker
  template:
    metadata:
      labels:
        app: failing-worker
    spec:
      containers:
        - name: failing-worker
          image: opstasks-backend:1.0.0
          imagePullPolicy: Never
          command:
            - python
            - -c
            - raise SystemExit("Injected worker failure")
