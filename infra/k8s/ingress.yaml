apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opstasks-ingress
  namespace: demo-app
spec:
  ingressClassName: nginx
  rules:
    - host: opstasks.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
