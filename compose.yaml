services:

  postgres:
    image: postgres:15-alpine@sha256:cd17e2ac98240fce1541ad2a803b34009b4eea5aec8a832363cdc7eca62e722e
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-opstasks}
      POSTGRES_USER: ${DATABASE_USER:?Create .env from .env.example}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Create .env from .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: ${DATABASE_NAME:-opstasks}
      DATABASE_USER: ${DATABASE_USER:?Create .env from .env.example}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Create .env from .env.example}
      DATABASE_PORT: "5432"
      ENABLE_DEMO_FAULTS: "true"
      DEMO_SLOW_DELAY_SECONDS: "3"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
