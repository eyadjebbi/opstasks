services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: opstasks
      POSTGRES_USER: opstasks
      POSTGRES_PASSWORD: opstasks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opstasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: opstasks
      DATABASE_USER: opstasks
      DATABASE_PASSWORD: opstasks
      DATABASE_PORT: "5432"
      ENABLE_DEMO_FAULTS: "true"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
